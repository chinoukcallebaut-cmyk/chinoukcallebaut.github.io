<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Een browservenster met links regels tekst en rechts de opmaak die eruit volgt.">
  <rect width="1200" height="800" fill="#D98C6E"/>
  <g stroke="#000" stroke-width="10" stroke-linejoin="miter">
    <rect x="90" y="110" width="1020" height="580" fill="#FCFCFA"/>
    <path d="M90 210 H1110" fill="none"/>
    <path d="M600 210 V690" fill="none"/>
    <circle cx="150" cy="160" r="20" fill="#B2D7DB"/>
    <circle cx="210" cy="160" r="20" fill="#5EBDB7"/>
    <circle cx="270" cy="160" r="20" fill="#F0AE33"/>

    <!-- rechts: de opmaak -->
    <rect x="650" y="260" width="410" height="180" fill="#B2D7DB"/>
    <rect x="650" y="470" width="190" height="170" fill="#F0AE33"/>
    <rect x="870" y="470" width="190" height="170" fill="#F1CCB7"/>
  </g>
  <!-- links: de regels die het beschrijven -->
  <g fill="#000">
    <rect x="140" y="270" width="320" height="18"/>
    <rect x="140" y="330" width="400" height="18"/>
    <rect x="190" y="390" width="250" height="18"/>
    <rect x="190" y="450" width="330" height="18"/>
    <rect x="140" y="510" width="180" height="18"/>
    <rect x="140" y="570" width="380" height="18"/>
  </g>
</svg>
